# À placer dans votre dépôt sous : .github/workflows/sync-weather.yml
#
# Exécute METAR/TAF/SIGMET toutes les 5 minutes, 24h/24, gratuitement, sans
# serveur à gérer. La flotte OpenSky est gérée par un second workflow séparé
# (sync-fleet.yml), avec sa propre fenêtre horaire et son propre quota — d'où
# le --no-fleet ici, pour ne jamais interroger OpenSky deux fois en double.
#
# Déclenchement : ce workflow n'utilise PAS le cron interne GitHub Actions
# (peu fiable en pratique). Il est déclenché toutes les 5 minutes via un
# appel externe workflow_dispatch depuis cron-job.org, ou manuellement
# via le bouton "Run workflow" dans l'onglet Actions.
#
# concurrency : évite que deux runs se chevauchent quand un déclenchement
# cron-job.org arrive alors qu'un run précédent est encore en file d'attente
# côté GitHub (runners publics parfois surchargés) -- sans ce bloc, GitHub
# annule alors tout seul l'ancien run encore en attente ("All jobs were
# cancelled" par email), ce qui n'est pas grave en soi (sync_weather.py fait
# un upsert de l'état météo ACTUEL à chaque passage, rien n'est cumulatif,
# donc rien n'est perdu) mais génère des alertes inutiles. cancel-in-progress
# à false : le nouveau run attend sagement en file, aucun run n'est jamais
# tué en cours d'exécution (ce qui, lui, pourrait interrompre un envoi
# Supabase à mi-chemin -- cancel-in-progress: true serait à éviter ici).
#
# Nécessite deux secrets de dépôt :
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     SUPABASE_URL          = https://xxxx.supabase.co
#     SUPABASE_SERVICE_KEY  = eyJ... (clé service_role, jamais la clé anon/publique)
name: Sync météo NOAA -> Supabase
on:
  workflow_dispatch: {}       # déclenché par cron-job.org toutes les 5 min, ou manuellement dans l'onglet Actions
concurrency:
  group: sync-weather
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer la synchronisation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python noaa_sync/sync_weather.py --no-fleet
