name: TEST dry-run SIGMET
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry-run SIGMET
        run: python noaa_sync/sync_weather.py --dry-run --no-fleet
