# À placer dans votre dépôt sous : .github/workflows/sync-fleet.yml
# (à côté de sync-weather.yml, PAS à sa place — les deux fichiers coexistent)
#
# Exécute UNIQUEMENT la flotte OpenSky, toutes les 5 minutes, de 04h00 à 23h55
# UTC (rien la nuit, 00h00-03h55). Séparé de sync-weather.yml pour ne jamais
# dépendre de son rythme, et pour garder le quota OpenSky (400 crédits/jour en
# anonyme) sous contrôle indépendamment de la météo.
#
# Budget crédits pour cette fenêtre : 20h × 12 passages/h = 240 appels/jour,
# 1 crédit chacun (requête filtrée par icao24, pas de zone géographique)
# -> 240 crédits/jour, sous le plafond de 400 avec de la marge.
#
# Déclenchement : ce workflow n'utilise PAS le cron interne GitHub Actions
# (peu fiable en pratique). Il est déclenché toutes les 5 minutes, entre
# 04h00 et 23h55 UTC, via un appel externe workflow_dispatch depuis
# cron-job.org, ou manuellement via le bouton "Run workflow" dans l'onglet
# Actions. La fenêtre horaire 04h-23h est donc gérée côté cron-job.org.
#
# concurrency : même raison que sync-weather.yml -- évite le chevauchement de
# deux runs et les annulations/emails "All jobs were cancelled" quand un
# déclenchement arrive pendant qu'un run précédent est encore en file
# d'attente côté GitHub. cancel-in-progress à false : le nouveau run attend
# en file, aucun run n'est jamais tué en cours de route. Important ici en
# particulier car fleet_track_history est un INSERT cumulatif (historique de
# trajectoire) -- un run interrompu à mi-chemin (cancel-in-progress: true)
# pourrait couper l'envoi en plein milieu, alors qu'une simple mise en file
# ne perd jamais rien, juste un léger décalage.
#
# Mêmes secrets que sync-weather.yml (déjà configurés si ce dernier existe) :
#   SUPABASE_URL, SUPABASE_SERVICE_KEY
name: Sync flotte OpenSky -> Supabase
on:
  workflow_dispatch: {}         # déclenché par cron-job.org (04h-23h UTC), ou manuellement dans l'onglet Actions
concurrency:
  group: sync-fleet
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer la synchronisation flotte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python noaa_sync/sync_weather.py --fleet-only
